name: Tests

on:
  push:
    branches: [main, launcher]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ONNX test dependencies
        run: python3 -m pip install onnx onnxruntime pillow numpy
      - name: Cross-platform local worker tests
        run: python3 -m unittest discover -s cross-platform/tests -p "test_*.py"
      - name: Mac ML worker tests
        run: python3 -m unittest discover -s mac/Tests/Python -p "test_*.py"

  web-interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the interface served by local_worker.py
        run: npm run build
      - name: Interface was built
        run: test -f ui/index.html

  mac-launcher:
    # The Swift launcher cannot be compiled on Linux, so macOS builds and tests it on every push.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
        working-directory: mac
      - name: Unit tests
        run: swift test
        working-directory: mac
